version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: gep_pv_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: gep_pv_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gep_network

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gep_pv_backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/gep_pv_monitoring
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres123
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - gep_network

  # Frontend React (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gep_pv_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gep_network

volumes:
  postgres_data:

networks:
  gep_network:
    driver: bridge
